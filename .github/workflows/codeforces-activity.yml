name: Update Codeforces activity
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/codeforces-activity.yml'
permissions:
  contents: write
concurrency:
  group: codeforces-activity
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh activity images
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const images = [];
          for (const theme of ['light', 'dark']) {
            const response = await fetch('https://cp-insights-three.vercel.app/api/profile?handle=ZiadMaghraby&theme=' + theme + '&heatmap=true&problemBarGraph=false', { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error('Activity provider returned ' + response.status);
            let svg = await response.text();
            if (!svg.includes('ZiadMaghraby') || !svg.includes('viewBox="0 0 780 395"') || !svg.includes('Heatmap')) throw new Error('Unexpected activity image; keeping previous images');
            svg = svg.replace(/width="780"/, 'width="795"').replace(/height="395"/, 'height="150"').replace('viewBox="0 0 780 395"', 'viewBox="15 245 740 140"');
            images.push([theme, svg]);
          }
          for (const [theme, svg] of images) await writeFile('codeforces-' + theme + '.svg', svg);
          NODE
      - name: Save refreshed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codeforces-light.svg codeforces-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Codeforces activity'
          git push
