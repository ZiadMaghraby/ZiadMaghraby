<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title"><title id="title">Developer terminal: Ziad Elmaghraby. Software engineering student. Backend .NET. C#, OOP and problem solving.</title><style>
