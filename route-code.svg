<svg xmlns="http://www.w3.org/2000/svg" width="420" height="142" viewBox="0 0 420 142" role="img" aria-labelledby="t"><title id="t">OPEN THE SOURCE</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.white{fill:#f3f4ea}.muted{fill:#91a0b6}.lime{fill:#d2ff5a}.purple{fill:#ba9aff}
@keyframes drift{to{stroke-dashoffset:-220}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes reveal{0%,10%{stroke-dashoffset:1900}65%,100%{stroke-dashoffset:0}}@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}.flow{stroke-dasharray:6 16;animation:drift 10s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.spin{transform-origin:center;transform-box:fill-box;animation:spin 45s linear infinite}.float{animation:float 7s ease-in-out infinite}.draw{stroke-dasharray:1900;animation:reveal 12s ease-in-out infinite}.blink{animation:blink 1.3s steps(1) infinite}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin,.float,.draw,.blink{animation:none}}</style><rect x="1" y="1" width="418" height="140" rx="20" fill="#0d1117" stroke="#303b4f"/><text x="24" y="35" class="mono" fill="#68dce5" font-size="16">ROUTE / 03</text><text x="23" y="80" class="white" font-size="27" font-weight="800">OPEN THE SOURCE</text><text x="24" y="115" class="mono muted" font-size="12">PROJECTS &amp; COURSEWORK</text><text x="392" y="37" text-anchor="end" fill="#68dce5" font-size="23">↗</text></svg>
