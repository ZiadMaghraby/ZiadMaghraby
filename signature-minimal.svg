    @keyframes d{0%,51%{stroke-dashoffset:1;opacity:1}65%,88%{stroke-dashoffset:0;opacity:1}97%,100%{opacity:0}}
    @keyframes underline{0%,67%{stroke-dashoffset:1;opacity:1}75%,88%{stroke-dashoffset:0;opacity:1}97%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.ink{animation:none;stroke-dashoffset:0;opacity:1}}
  </style>
