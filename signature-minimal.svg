<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176" role="img" aria-labelledby="title desc">
  <title id="title">Ziad Elmaghraby — Software Engineer · Backend .NET</title>
  <desc id="desc">Signature concept 01: a fine flowing monoline Ziad signature. Writes once and remains visible.</desc>
  <style>
    .name{fill:#447fae}.muted{fill:#77818d}.track{stroke:#77818d;stroke-opacity:.3}.accent{stroke:#447fae}
    .ink{stroke-dasharray:1;stroke-dashoffset:0}
    .name-stroke{animation:write 4.6s linear 1 both}
    .dot{animation:dot .22s ease-out 4.75s 1 both}
    @keyframes write{0%,5%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
    @keyframes dot{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:1}}
    @media(prefers-reduced-motion:reduce){.ink{animation:none;stroke-dashoffset:0;opacity:1}}
  </style>
  <g font-family="Arial,Helvetica,sans-serif">
