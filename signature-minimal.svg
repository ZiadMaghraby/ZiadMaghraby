<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176" role="img" aria-labelledby="title desc">
  <title id="title">Ziad Elmaghraby — Software Engineer · Backend .NET</title>
  <desc id="desc">A clean vector Ziad signature, written from left to right: Z, i, a, d.</desc>
  <style>
    .name{fill:#447fae}.muted{fill:#77818d}.track{stroke:#77818d;stroke-opacity:.3}.accent{stroke:#447fae}
    .ink{stroke-dasharray:1;stroke-dashoffset:0;animation-duration:10s;animation-timing-function:linear;animation-iteration-count:infinite}
    .z{animation-name:z}.i{animation-name:i}.idot{animation-name:idot}.a{animation-name:a}.d{animation-name:d}.underline{animation-name:underline}
    @keyframes z{0%,5%{stroke-dashoffset:1;opacity:1}23%,88%{stroke-dashoffset:0;opacity:1}97%,100%{opacity:0}}
    @keyframes i{0%,25%{stroke-dashoffset:1;opacity:1}32%,88%{stroke-dashoffset:0;opacity:1}97%,100%{opacity:0}}
