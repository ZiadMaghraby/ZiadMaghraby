<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title"><title id="title">Problem solving profiles. LeetCode and Codeforces.</title><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.ivory{fill:#f3f4ea}.muted{fill:#91a0b6}.lime{fill:#d2ff5a}.purple{fill:#ba9aff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.reverse{transform-box:fill-box;transform-origin:center;animation:reverse 22s linear infinite}.flow{stroke-dasharray:5 15;animation:flow 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.blink{animation:blink 1.2s steps(1) infinite}
@media(prefers-reduced-motion:reduce){.spin,.reverse,.flow,.pulse,.float,.blink{animation:none}}
</style><defs><radialGradient id="ambient"><stop stop-color="#6b44be" stop-opacity=".26"/><stop offset="1" stop-color="#10151e" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#d2ff5a"/><stop offset=".45" stop-color="#27334a"/><stop offset="1" stop-color="#ba9aff"/></linearGradient></defs><rect x="1" y="1" width="598" height="458" rx="20" fill="#0f151f" stroke="#303c51"/><path d="M24 1H576" stroke="url(#edge)" stroke-width="2"/><text x="30" y="40" class="mono muted" font-size="16" letter-spacing="2">WHERE I CHALLENGE MY THINKING</text><text x="30" y="116" class="ivory" font-size="41" font-weight="900">THINK DEEPER.</text><text x="30" y="166" class="ivory" font-size="41" font-weight="900">BUILD BETTER.</text><path d="M30 195H110" stroke="#d2ff5a" stroke-width="4"/><rect x="30" y="234" width="540" height="76" rx="13" fill="#192127" stroke="#596144"/><text x="57" y="281" fill="#d2ff5a" class="mono" font-size="29">&lt;/&gt;</text><text x="151" y="281" class="ivory" font-size="28" font-weight="700">LeetCode</text><text x="530" y="282" text-anchor="end" class="lime" font-size="28">↗</text><rect x="30" y="332" width="540" height="76" rx="13" fill="#1b192b" stroke="#5a4b77"/><path d="M64 381V360M78 381V349M92 381V365" stroke="#ba9aff" stroke-width="7"/><text x="151" y="379" class="ivory" font-size="28" font-weight="700">Codeforces</text><text x="530" y="380" text-anchor="end" class="purple" font-size="28">↗</text></svg>
