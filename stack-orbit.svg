<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title"><title id="title">Technology orbit: C# and .NET at the center. Java, PHP, Git and GitHub in my projects.</title><style>
