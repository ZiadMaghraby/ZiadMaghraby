<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title"><title id="title">Problem solving loop. Understand, decompose, implement, refine.</title><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.ivory{fill:#f3f4ea}.muted{fill:#91a0b6}.lime{fill:#d2ff5a}.purple{fill:#ba9aff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.reverse{transform-box:fill-box;transform-origin:center;animation:reverse 22s linear infinite}.flow{stroke-dasharray:5 15;animation:flow 4s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.blink{animation:blink 1.2s steps(1) infinite}
@media(prefers-reduced-motion:reduce){.spin,.reverse,.flow,.pulse,.float,.blink{animation:none}}
</style><defs><radialGradient id="ambient"><stop stop-color="#6b44be" stop-opacity=".26"/><stop offset="1" stop-color="#10151e" stop-opacity="0"/></radialGradient><linearGradient id="edge"><stop stop-color="#d2ff5a"/><stop offset=".45" stop-color="#27334a"/><stop offset="1" stop-color="#ba9aff"/></linearGradient></defs><rect x="1" y="1" width="598" height="458" rx="20" fill="#0f151f" stroke="#303c51"/><path d="M24 1H576" stroke="url(#edge)" stroke-width="2"/><text x="30" y="40" class="mono muted" font-size="16" letter-spacing="2">THE PROBLEM-SOLVING ENGINE</text><path d="M166 135H434V325H166Z" fill="none" stroke="#3c4c65" stroke-width="2"/><path d="M166 135H434V325H166Z" fill="none" stroke="#d2ff5a" stroke-width="3" class="flow"/><g fill="#151e2d" stroke="#4d5c78"><rect x="47" y="97" width="225" height="76" rx="14"/><rect x="328" y="97" width="225" height="76" rx="14"/><rect x="328" y="287" width="225" height="76" rx="14"/><rect x="47" y="287" width="225" height="76" rx="14"/></g><text x="160" y="143" text-anchor="middle" class="mono ivory" font-size="22">01 UNDERSTAND</text><text x="440" y="143" text-anchor="middle" class="mono ivory" font-size="22">02 DECOMPOSE</text><text x="440" y="333" text-anchor="middle" class="mono ivory" font-size="22">03 IMPLEMENT</text><text x="160" y="333" text-anchor="middle" class="mono ivory" font-size="22">04 REFINE</text><circle cx="300" cy="230" r="42" fill="#241b39" stroke="#ba9aff"/><text x="300" y="240" text-anchor="middle" class="lime" font-size="34">∞</text><text x="300" y="419" text-anchor="middle" class="mono muted" font-size="17">DIFFERENT PROBLEMS. SAME CURIOSITY.</text></svg>
