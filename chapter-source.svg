<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="115" viewBox="0 0 1200 115" role="img" aria-labelledby="t"><title id="t">THE SOURCE</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.white{fill:#f3f4ea}.muted{fill:#91a0b6}.lime{fill:#d2ff5a}.purple{fill:#ba9aff}
@keyframes drift{to{stroke-dashoffset:-220}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes reveal{0%,10%{stroke-dashoffset:1900}65%,100%{stroke-dashoffset:0}}@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}.flow{stroke-dasharray:6 16;animation:drift 10s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.spin{transform-origin:center;transform-box:fill-box;animation:spin 45s linear infinite}.float{animation:float 7s ease-in-out infinite}.draw{stroke-dasharray:1900;animation:reveal 12s ease-in-out infinite}.blink{animation:blink 1.3s steps(1) infinite}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin,.float,.draw,.blink{animation:none}}</style><rect width="1200" height="115" fill="#0d1117"/><text x="4" y="78" fill="#273247" font-size="78" font-weight="900">03</text><text x="116" y="62" class="white" font-size="32" font-weight="800" letter-spacing="2">THE SOURCE</text><text x="118" y="93" class="mono muted" font-size="14" letter-spacing="2">IDEAS YOU CAN OPEN</text><path d="M790 63H1190" stroke="#344058"/><path d="M790 63H1190" stroke="#d2ff5a" stroke-width="2" class="flow"/><circle cx="1190" cy="63" r="5" fill="#d2ff5a"/></svg>
